name: Test Implementation Validation

on:
  pull_request:
    branches: [main, sandbox]
    paths: ['tests/**', 'src/**']

jobs:
  validate-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - run: npm ci
      
      - name: Run Test Progress Report
        run: npm run test:progress
      
      - name: Validate Test Implementation
        run: npm run test:validate
      
      - name: Run Unit Tests with Coverage
        run: npm run test:coverage
      
      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
      
      - name: Install Playwright
        run: npx playwright install
      
      - name: Run E2E Tests
        run: npm run e2e
      
      - name: Upload E2E Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
      
      - name: Comment PR with Test Progress
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const progress = execSync('npm run test:progress', { encoding: 'utf8' });
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🎯 Test Implementation Progress\n\n\`\`\`\n${progress}\n\`\`\``
            });